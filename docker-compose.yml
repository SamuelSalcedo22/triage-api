services:
  postgres:
    image: postgres:16-alpine
    container_name: triage_postgres
    environment:
      POSTGRES_DB: triage_db
      POSTGRES_USER: triage_user
      POSTGRES_PASSWORD: triage_password
    ports:
      # Puerto 5433 en tu PC para no chocar con otro Postgres (por ejemplo el del proyecto de clase)
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Docker sabe cuándo la base de datos ya acepta conexiones
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage_user -d triage_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Opcional: pgAdmin para ver las tablas desde el navegador (http://localhost:5050)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: triage_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@triage.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  # La API dentro de Docker. Solo se levanta con el perfil "completo":
  #   docker compose --profile completo up --build
  api:
    profiles: ["completo"]
    build: .
    container_name: triage_api
    environment:
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: triage_db
      POSTGRES_USER: triage_user
      POSTGRES_PASSWORD: triage_password
      UPLOADS_DIR: uploads
      MAX_UPLOAD_MB: 10
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
  uploads_data:
